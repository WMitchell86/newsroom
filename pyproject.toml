[project]
name = "editor-assistant"
version = "0.0.1"
description = "Assistant to the editor-in-chief for chernomorie-bg.com (M0 safety foundation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Approved scope change (M2S-R2): zero-signup fallback search backend.
# Everything else in the provider stack remains stdlib-only.
search = ["ddgs>=9"]
# M3J: TypeSafe Jev used ONLY as a shadow semantic judge (no production
# authority). Optional by design: a missing package/key must never break the
# project's normal functionality.
jev = ["typesafe-sdk>=0.6,<0.7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
